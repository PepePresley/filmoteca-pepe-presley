name: Probar Filmoteca publicada
on:
  push:
    paths: ['.github/workflows/inspeccionar-ui-2024.yml']
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar y comprobar web pública
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,re
          base="https://pepepresley.github.io/filmoteca-pepe-presley/"
          for n in range(12):
              try:
                  html=urllib.request.urlopen(base+"?v=smoke205a484",timeout=20).read().decode("utf-8")
                  if "data/catalog/catalog.json" in html:
                      break
              except Exception as e:
                  print("espera",n,e)
              time.sleep(10)
          else: raise SystemExit("La versión ligera aún no está publicada")
          print("HTML publicado bytes:",len(html.encode()))
          assert len(html.encode()) < 200000
          assert "Filmoteca" in html
          assert "data/catalog/catalog.json" in html
          raw=urllib.request.urlopen(base+"data/catalog/catalog.json?v=smoke205a484",timeout=60).read()
          data=json.loads(raw)
          print("Catálogo publicado bytes:",len(raw))
          print("Películas publicadas:",len(data))
          assert len(data)==52929
          assert all(k in data[0] for k in ("t","y"))
          for y in (2021,2022):
              assert f"Cannes {y}" in html
          print("Cannes 2021/2022: OK")
          print("SMOKE TEST PUBLICO: OK")
          PY
