name: Comprobar Filmoteca estable publicada
on:
  push:
    paths: ['.github/workflows/inspeccionar-ui-2024.yml']
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar web publicada
        run: |
          python3 - <<'PY'
          import urllib.request
          u="https://pepepresley.github.io/filmoteca-pepe-presley/?v=d8a9fb2"
          s=urllib.request.urlopen(u,timeout=60).read().decode("utf-8")
          print("HTML publicado bytes:",len(s.encode()))
          checks={
            "catalogo_incrustado":"const DATA = [" in s,
            "sin_error_tags":"const FESTIVAL_TAGSconst" not in s,
            "arranque_render":"chooseSpot();render();" in s,
            "buscador":'id="q"' in s,
            "filtro_ano":'id="year"' in s,
            "pestana_festivales":'id="tabFestivals"' in s,
          }
          for k,v in checks.items(): print(k,":","OK" if v else "FALLO")
          assert len(s.encode())>10_000_000
          assert all(checks.values())
          open("/tmp/index.html","w").write(s)
          PY
          python3 - <<'PY'
          import re
          s=open("/tmp/index.html").read()
          open("/tmp/app.js","w").write("\n".join(re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)))
          PY
          node --check /tmp/app.js
          echo "JAVASCRIPT PUBLICADO: OK"
