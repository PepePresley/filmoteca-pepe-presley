name: Inspeccionar UI 2024
on:
  push:
    paths: ['.github/workflows/inspeccionar-ui-2024.yml']
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for needle in ["Cannes 1995","quick","collection","activeFestival","cannes1995"]:
              print("\n###",needle)
              p=0
              for _ in range(4):
                  i=s.lower().find(needle.lower(),p)
                  if i<0: break
                  print(s[max(0,i-1800):i+3000].replace("\n"," ")[:4800])
                  p=i+len(needle)
          PY
