name: Smoke test LAB publicado
on:
  push:
    paths: ['LAB_PUBLIC_TEST']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar LAB publicado actual
        run: |
          python3 - <<'PY'
          import urllib.request,time
          url='https://pepepresley.github.io/filmoteca-pepe-presley/lab/?diag=2a882581'
          time.sleep(20)
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Filmoteca-Diagnostic'})
          h=urllib.request.urlopen(req,timeout=60).read().decode('utf-8')
          print('html_bytes',len(h.encode()))
          for text in ['LAB e2b9 → PRUEBA 2024','data-year="2024"','FESTIVAL_MATCH_TAGS']:
              print(text, 'SI' if text in h else 'NO')
          print('snippet:',h[h.find('Elige un año')-200:h.find('Elige un año')+1200])
          PY
