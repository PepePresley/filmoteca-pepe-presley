name: Inspeccionar UI festivales
on:
  push:
    paths: ['.github/workflows/inspeccionar-ui-2024.yml']
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar estructura y funciones de festivales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["festivalHub","FESTIVAL_TAGS","festivalYearBtn","renderFestival","tabFestivals","festGridYears","festivalModal","activeFestival","festivalRows"]
          for needle in needles:
              print("\n###",needle)
              p=0
              for _ in range(12):
                  i=s.find(needle,p)
                  if i<0: break
                  print("\n--- HIT",i,"---")
                  print(s[max(0,i-1800):i+5000])
                  p=i+len(needle)
          PY
