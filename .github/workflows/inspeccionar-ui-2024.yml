name: Aligerar Filmoteca
on:
  push:
    paths: ['.github/workflows/inspeccionar-ui-2024.yml']
permissions:
  contents: write
jobs:
  aligerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extraer catálogo del HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          before=len(s.encode("utf-8"))
          m=re.search(r'const DATA = (\[.*?\]);\s*const FESTIVAL_TAGS',s,re.S)
          if not m: raise SystemExit("No se localiza DATA en index.html")
          data=json.loads(m.group(1))
          out=Path("data/catalog")
          out.mkdir(parents=True,exist_ok=True)
          (out/"catalog.json").write_text(json.dumps(data,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          # Sustituimos el catálogo incrustado por carga externa síncrona antes del resto del JS.
          # XMLHttpRequest síncrono aquí mantiene intacta toda la lógica existente y minimiza el riesgo.
          loader='''let DATA=[];\n(function(){\n const x=new XMLHttpRequest();\n x.open("GET","data/catalog/catalog.json?v=1",false);\n x.send(null);\n if(x.status>=200&&x.status<300||x.status===0) DATA=JSON.parse(x.responseText);\n else throw new Error("No se pudo cargar el catálogo");\n})();\nconst FESTIVAL_TAGS'''
          s=s[:m.start()] + loader + s[m.end()-len("const FESTIVAL_TAGS"):]
          p.write_text(s,encoding="utf-8")
          after=len(s.encode("utf-8"))
          cat=(out/"catalog.json").stat().st_size
          print("Películas:",len(data))
          print("index antes:",before)
          print("index después:",after)
          print("catalog.json:",cat)
          print("reducción index:",before-after)
          assert len(data)>1000
          assert after < 2_000_000, after
          assert "const DATA = [" not in s
          assert "const FESTIVAL_TAGS" in s
          PY
      - name: Validar y guardar
        run: |
          python3 -m json.tool data/catalog/catalog.json >/dev/null
          git diff --check
          test -s data/catalog/catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/catalog/catalog.json
          git commit -m "Extrae el catálogo del HTML y aligera la web"
          git push origin HEAD:main
