name: Smoke test LAB publicado
on:
  push:
    paths: ['LAB_PUBLIC_TEST']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar LAB publicado
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://pepepresley.github.io/filmoteca-pepe-presley'
          h=urllib.request.urlopen(base+'/lab/?v=35c05571',timeout=60).read().decode('utf-8')
          d=json.loads(urllib.request.urlopen(base+'/data/catalog/catalog.json?v=lab3',timeout=60).read())
          print('html_bytes',len(h.encode()))
          print('peliculas',len(d))
          checks=[
            ('async','async function arrancarFilmoteca' in h),
            ('fetch_correcto','../data/catalog/catalog.json?v=lab3' in h),
            ('render','chooseSpot();render();' in h),
            ('buscador','id="q"' in h),
            ('festivales','id="tabFestivals"' in h),
          ]
          for k,v in checks: print(k,'OK' if v else 'FALLO')
          assert len(h.encode())<100000
          assert len(d)==52929
          assert all(v for _,v in checks)
          print('LAB_PUBLICADO_OK')
          PY
