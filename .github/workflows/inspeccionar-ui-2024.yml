name: Inspeccionar cargador de festivales
on:
  push:
    paths: ['.github/workflows/inspeccionar-ui-2024.yml']
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar codigo de festivales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["cannes_1990_1994","Cannes 1990","data/festivals","fetch(","festival_year","activeFestival","festivals"]
          for needle in needles:
              print("\n###",needle)
              p=0
              for _ in range(8):
                  i=s.lower().find(needle.lower(),p)
                  if i<0: break
                  print("\n--- HIT",i,"---")
                  print(s[max(0,i-1200):i+2200])
                  p=i+len(needle)
          PY
