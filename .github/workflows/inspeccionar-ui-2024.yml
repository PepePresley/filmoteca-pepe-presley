name: Probar prototipo aligerado
on:
  push:
    branches: [lab-aligerado]
    paths: [LAB_TEST_3]
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-aligerado
      - name: Validar estructura
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text(encoding='utf-8')
          d=json.loads(Path('data/catalog/catalog.json').read_text(encoding='utf-8'))
          print('peliculas',len(d))
          print('html_bytes',len(s.encode()))
          checks=[
            ('carga_asincrona','async function arrancarFilmoteca' in s),
            ('espera_json','window.__CATALOGO__=await r.json()' in s),
            ('render','chooseSpot();render();' in s),
            ('buscador','id="q"' in s),
            ('filtro_ano','id="year"' in s),
            ('festivales','id="tabFestivals"' in s),
            ('sin_data_embebida','const DATA = [' not in s),
          ]
          for k,v in checks: print(k,'OK' if v else 'FALLO')
          assert len(d)==52929
          assert len(s.encode())<100000
          assert all(v for _,v in checks)
          PY
          echo PROTOTIPO_ALIGERADO_OK
