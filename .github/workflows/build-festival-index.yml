name: Build festival indexes
on:
  push:
    branches:
      - lab-lightweight-festival-index
    paths:
      - 'scripts/build-festival-index.mjs'
      - '.github/workflows/build-festival-index.yml'
      - 'data/catalog/catalog.json'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-lightweight-festival-index
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-festival-index.mjs
      - run: node scripts/verify-festival-index.mjs
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/festival-index
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate lightweight festival indexes"
            git push
          fi
