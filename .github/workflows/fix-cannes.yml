name: Corregir Cannes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-cannes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir error de renderizado de festivales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''${FESTIVAL_BY_IDX.has(DATA.indexOf(r))?`<span class="tag" style="border-color:#7c6535;color:#e7c97e">🏆 ${x.festival} ${x.festival_year}</span><span class="tag" style="${FESTIVAL_BY_IDX.get(DATA.indexOf(r)).award.includes('sin premio')?'border-color:#4f4b43;color:#bdb6aa':'border-color:#8c6e25;color:#ffd978'}">${FESTIVAL_BY_IDX.get(DATA.indexOf(r)).award}</span>`:''}'''
          new='''${FESTIVAL_BY_IDX.has(DATA.indexOf(r))?(()=>{const ft=FESTIVAL_BY_IDX.get(DATA.indexOf(r));return `<span class="tag" style="border-color:#7c6535;color:#e7c97e">🏆 ${ft.festival} ${ft.festival_year}</span><span class="tag" style="${ft.award.includes('En competición')?'border-color:#4f4b43;color:#bdb6aa':'border-color:#8c6e25;color:#ffd978'}">${ft.award}</span>`})():''}'''
          if old not in s:
              raise SystemExit("No se encontró el bloque esperado")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Guardar corrección
        run: |
          git config user.name "Filmoteca Pepe Presley"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir visualización de películas de Cannes"
          git push
