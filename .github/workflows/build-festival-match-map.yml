name: Build exact festival match map
on:
  push:
    branches:
      - 'lab-*'
      - 'catalog-*'
      - 'festival-*'
    paths:
      - '.github/workflows/build-festival-match-map.yml'
      - 'scripts/build-festival-matches.mjs'
      - 'data/catalog/catalog.json'
      - 'data/catalog/annual_*_overlay.json'
      - 'data/catalog/festival-owned-*.json'
      - 'data/festivals/festivals.json'
      - 'data/festivals/years/**'
      - 'scripts/build-festivals.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-festival-match-map.yml'
      - 'scripts/build-festival-matches.mjs'
      - 'data/catalog/catalog.json'
      - 'data/catalog/annual_*_overlay.json'
      - 'data/catalog/festival-owned-*.json'
      - 'data/catalog/festival-matches.json'
      - 'data/festivals/festivals.json'
      - 'data/festivals/years/**'
      - 'scripts/build-festivals.mjs'
permissions:
  contents: write
concurrency:
  group: exact-festival-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify festival artifact comes from annual sources
        run: node scripts/build-festivals.mjs --check
      - name: Generate festival associations
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          SOURCE_BRANCH="${SOURCE_BRANCH#codex/}"
          if [[ "$SOURCE_BRANCH" =~ ^filmoteca-([0-9]{4})-certamenes$ ]]; then
            node scripts/build-festival-matches.mjs --year="${BASH_REMATCH[1]}"
          elif [[ "$SOURCE_BRANCH" =~ ^filmoteca-([0-9]{4})-catalogo$ ]]; then
            node scripts/build-festival-matches.mjs --years="${BASH_REMATCH[1]},$((BASH_REMATCH[1]+1))"
          elif [[ "$SOURCE_BRANCH" == "filmoteca-titulos-filmaffinity" ]]; then
            node scripts/build-festival-matches.mjs --years="2010,2024,2025"
          elif [[ "$SOURCE_BRANCH" == "filmoteca-titulos-2000-2009" ]]; then
            node scripts/build-festival-matches.mjs --years="2000,2001,2002,2003,2004,2005,2006,2007,2008,2009" --labels-only
          elif [[ "$SOURCE_BRANCH" == "filmoteca-fuentes-anuales" ]]; then
            YEARS=$(node -e 'const fs=require("node:fs");const db=JSON.parse(fs.readFileSync("data/festivals/festivals.json","utf8"));process.stdout.write([...new Set(db.editions.map(e=>e.year))].join(","))')
            node scripts/build-festival-matches.mjs --years="$YEARS" --labels-only
          else
            node scripts/build-festival-matches.mjs
          fi
      - name: Commit exact match map on staging branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/festival-matches.json
          if git diff --cached --quiet; then
            echo "No map changes"
          else
            git commit -m "Generate exact festival match map"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify exact match map is current
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data/catalog/festival-matches.json
