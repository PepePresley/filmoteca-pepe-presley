name: Build exact festival match map
on:
  push:
    branches:
      - lab-lightweight-festival-index
    paths:
      - '.github/workflows/build-festival-match-map.yml'
      - 'scripts/build-festival-matches.mjs'
permissions:
  contents: write
concurrency:
  group: exact-festival-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-lightweight-festival-index
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-festival-matches.mjs
      - name: Commit exact match map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/festival-matches.json
          if git diff --cached --quiet; then
            echo "No map changes"
          else
            git commit -m "Generate exact festival match map"
            git pull --rebase origin lab-lightweight-festival-index
            git push
          fi
