name: Build exact festival match map
on:
  push:
    branches:
      - 'lab-*'
      - 'catalog-*'
      - 'festival-*'
    paths:
      - '.github/workflows/build-festival-match-map.yml'
      - 'scripts/build-festival-matches.mjs'
      - 'scripts/festival-match-rules.mjs'
      - 'scripts/plan-festival-matches*.mjs'
      - 'data/catalog/catalog.json'
      - 'data/catalog/annual_*_overlay.json'
      - 'data/catalog/festival-owned-*.json'
      - 'data/festivals/festivals.json'
      - 'data/festivals/years/**'
      - 'scripts/build-festivals.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-festival-match-map.yml'
      - 'scripts/build-festival-matches.mjs'
      - 'scripts/festival-match-rules.mjs'
      - 'scripts/plan-festival-matches*.mjs'
      - 'data/catalog/catalog.json'
      - 'data/catalog/annual_*_overlay.json'
      - 'data/catalog/festival-owned-*.json'
      - 'data/catalog/festival-matches.json'
      - 'data/festivals/festivals.json'
      - 'data/festivals/years/**'
      - 'scripts/build-festivals.mjs'
permissions:
  contents: write
concurrency:
  group: exact-festival-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify festival artifact comes from annual sources
        run: node scripts/build-festivals.mjs --check
      - name: Test association impact and preservation
        run: node --test scripts/plan-festival-matches.test.mjs
      - name: Generate festival associations from changed inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git merge-base HEAD origin/main)
          fi
          node scripts/plan-festival-matches.mjs --base="$BASE_SHA"
      - name: Commit exact match map on staging branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/festival-matches.json
          if git diff --cached --quiet; then
            echo "No map changes"
          else
            git commit -m "Generate exact festival match map"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify exact match map is current
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data/catalog/festival-matches.json
