name: Merge 1988 festival data
on:
  push:
    branches:
      - lab-1988-complete
    paths:
      - '.github/workflows/merge-1988-festivals.yml'
      - 'scripts/merge-1988-festivals.mjs'
      - 'data/staging/1988/**'
permissions:
  contents: write
concurrency:
  group: merge-1988-festivals
  cancel-in-progress: true
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-1988-complete
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/merge-1988-festivals.mjs
      - name: Commit merged festival data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/festivals/festivals.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add complete 1988 festival and Oscar data"
            git pull --rebase origin lab-1988-complete
            git push origin HEAD:lab-1988-complete
          fi
