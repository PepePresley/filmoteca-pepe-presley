name: Verify festival parity fast
on:
  push:
    branches:
      - lab-lightweight-festival-index
    paths:
      - '.github/workflows/verify-festival-fast.yml'
      - 'scripts/build-festival-matches.mjs'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-lightweight-festival-index
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-festival-matches.mjs
      - run: node scripts/verify-festival-index.mjs
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/festival-index/verification.json data/catalog/festival-matches.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update festival parity verification report"
            git push
          fi
